# http context. The source is the TCP peer, never a client-supplied forwarding header.
geo $remote_addr $ccs_mainland_allowed {
    default 0;
    include /etc/nginx/geoip/ccs-mainland-ranges.conf;
}
# Certificate issuance/renewal must remain reachable. This exception exposes
# only ACME token paths, never the application pages or APIs.
map $uri $ccs_acme_challenge {
    default 0;
    ~^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ 1;
}
map "$ccs_mainland_allowed:$ccs_acme_challenge" $ccs_mainland_block {
    default 1;
    ~^1: 0;
    "0:1" 0;
}
