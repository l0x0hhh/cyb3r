# CI only: verify pull requests and main branch changes without deploying.
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          check-latest: true
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check db/repository.js
          bash -n deploy/update-from-git.sh
          bash -n deploy/setup-cd.sh

      - name: Check frontend types
        run: npm run typecheck

      - name: Run tests
        run: node --test --test-concurrency=1

      - name: Build frontend
        run: npm run build
