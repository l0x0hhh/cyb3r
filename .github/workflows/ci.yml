# CI：后端 CommonJS 用 node --check，前端 ESM 由 Vite 构建解析。
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.5.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check db/repository.js

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build
