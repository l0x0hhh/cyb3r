# CI/CD：类型检查、测试与构建全部通过后，main 才能触发精确提交发布。
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check db/repository.js
          bash -n deploy/update-from-git.sh
          bash -n deploy/setup-cd.sh

      - name: Check frontend types
        run: npm run typecheck

      - name: Run tests
        run: node --test --test-concurrency=1

      - name: Build frontend
        run: npm run build

  deploy:
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: device-management-production
      cancel-in-progress: false
    steps:
      - name: Deploy verified commit to Tencent Cloud
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '43.138.146.44' }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_PRIVATE_KEY" || { echo 'Missing DEPLOY_PRIVATE_KEY'; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'Missing DEPLOY_KNOWN_HOSTS'; exit 1; }
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/device-cd.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "device-deploy@$DEPLOY_HOST" "deploy $GITHUB_SHA"
          printf '### Production deployment command succeeded\nCommit: `%s`\nTarget: `%s`\nSee SSH log for deployed/already-current/stale status.\n' \
            "$GITHUB_SHA" "$DEPLOY_HOST" >> "$GITHUB_STEP_SUMMARY"
